[global]
    follow = keyboard
    width = 360
    origin = top-right
    offset = (18, 42)
    notification_limit = 4
    font = DejaVu Sans Mono 10
    padding = 14
    horizontal_padding = 16
    frame_width = 2
    frame_color = "#C170FF"
    separator_height = 2
    separator_color = "#27334B"
    corner_radius = 0
    transparency = 0
    format = "%s\n%b"
    markup = no
    icon_position = off
    mouse_left_click = close_current
    mouse_middle_click = do_action
    mouse_right_click = close_all

[urgency_low]
    background = "#090D16"
    foreground = "#5A96FF"
    timeout = 4

[urgency_normal]
    background = "#090D16"
    foreground = "#00EB74"
    timeout = 6

[urgency_critical]
    background = "#090D16"
    foreground = "#FFB85C"
    frame_color = "#FFB85C"
    timeout = 0
